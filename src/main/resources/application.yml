spring:
  application:
    name: json-dataset-operators

  datasource:
    # Default: embedded H2 (relational) so the app runs with zero setup.
    # Use "--spring.profiles.active=postgres" for PostgreSQL (see application-postgres.yml).
    url: jdbc:h2:mem:datasetops;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.assignment.datasetops: INFO
