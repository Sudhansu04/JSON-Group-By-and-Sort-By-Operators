# PostgreSQL for the "postgres" Spring profile.
#   docker compose up -d
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# Credentials match the defaults in src/main/resources/application-postgres.yml.
services:
  postgres:
    image: postgres:16-alpine
    container_name: datasetops-postgres
    environment:
      POSTGRES_DB: datasetops
      POSTGRES_USER: datasetops
      POSTGRES_PASSWORD: datasetops
    ports:
      - "5432:5432"
    volumes:
      - datasetops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datasetops -d datasetops"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  datasetops-pgdata:
